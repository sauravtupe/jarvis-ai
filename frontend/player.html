<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J.A.R.V.I.S — Lecture</title>
<style>
  html, body { margin: 0; height: 100%; width: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; }
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* Controls float over the video and fade unless hovered */
  .pbtn {
    position: fixed; z-index: 10; cursor: pointer;
    background: rgba(20, 24, 38, 0.72); color: #eaf2ff;
    border: 1px solid rgba(120, 160, 255, 0.35); border-radius: 10px;
    padding: 9px 14px; font-size: 14px; line-height: 1; letter-spacing: .2px;
    backdrop-filter: blur(6px); text-decoration: none; transition: opacity .3s, background .2s;
  }
  .pbtn:hover { background: rgba(40, 60, 110, 0.92); }
  #fsbtn { top: 14px; right: 14px; }
  #ytlink { bottom: 14px; right: 14px; font-size: 12.5px; opacity: .55; }
  #ytlink:hover { opacity: 1; }
  #hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    z-index: 9; color: #cdd9f5; font-size: 13px; padding: 8px 16px;
    background: rgba(20, 24, 38, 0.7); border-radius: 20px; backdrop-filter: blur(6px);
    pointer-events: none; transition: opacity .5s;
  }
  #err {
    position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    color: #eaf2ff; padding: 24px; z-index: 20; background: #05070d;
  }
  #err a { color: #7aa2ff; }
</style>
</head>
<body>
  <div id="stage"></div>
  <button id="fsbtn" class="pbtn" title="Fullscreen (or press F)">&#9974; Fullscreen</button>
  <a id="ytlink" class="pbtn" target="_blank" rel="noopener">Open on YouTube &#8599;</a>
  <div id="hint">Click anywhere for fullscreen</div>
  <div id="err">
    <div>
      <p>This video can't be embedded.</p>
      <p><a id="errlink" href="#">Opening it on YouTube&hellip;</a></p>
    </div>
  </div>

<script>
(function () {
  // --- Parse + validate the video id (untrusted URL input) ---
  var params = new URLSearchParams(location.search);
  var vid = (params.get('v') || '').trim();
  if (!/^[A-Za-z0-9_-]{11}$/.test(vid)) {
    location.replace('https://www.youtube.com/');
    return;
  }
  var watchUrl = 'https://www.youtube.com/watch?v=' + vid;
  document.getElementById('ytlink').href = watchUrl;
  document.getElementById('errlink').href = watchUrl;

  var stage = document.getElementById('stage');
  var hint = document.getElementById('hint');

  function goFullscreen() {
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) { try { req.call(el); } catch (_) {} }
  }

  function fallbackToYouTube() {
    document.getElementById('err').style.display = 'grid';
    setTimeout(function () { location.replace(watchUrl); }, 1200);
  }

  // --- Load the YouTube IFrame API (gives us autoplay + an onError hook) ---
  var player;
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('stage', {
      videoId: vid,
      playerVars: {
        autoplay: 1, rel: 0, modestbranding: 1, fs: 1,
        playsinline: 1, iv_load_policy: 3
      },
      events: {
        onReady: function (e) {
          // Best-effort auto-fullscreen. Browsers usually require a user click
          // (the lecture is often voice-triggered, so no click exists yet) —
          // if it's blocked, the video still fills the whole tab, and the
          // first click anywhere (below) takes it truly fullscreen.
          goFullscreen();
          try { e.target.playVideo(); } catch (_) {}
        },
        onError: function (e) {
          // 101 / 150 = embedding disabled by the uploader; 2 / 100 = bad/removed id.
          if ([2, 100, 101, 150].indexOf(e.data) !== -1) fallbackToYouTube();
        }
      }
    });
  };
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  // --- First interaction anywhere → true fullscreen (the reliable path) ---
  function firstGesture() {
    goFullscreen();
    if (hint) hint.style.opacity = '0';
    document.removeEventListener('pointerdown', firstGesture);
    document.removeEventListener('keydown', onKey);
  }
  function onKey(ev) {
    if (ev.key === 'f' || ev.key === 'F') goFullscreen();
    firstGesture();
  }
  document.addEventListener('pointerdown', firstGesture);
  document.addEventListener('keydown', onKey);
  document.getElementById('fsbtn').addEventListener('click', function (ev) {
    ev.stopPropagation();
    goFullscreen();
  });

  // Hide the hint after a few seconds even if untouched.
  setTimeout(function () { if (hint) hint.style.opacity = '0'; }, 5000);
})();
</script>
</body>
</html>
